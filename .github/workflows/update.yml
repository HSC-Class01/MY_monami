name: DART monthly update
on:
  schedule:
    - cron: '10 0 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Collect DART reports and calculate ratios
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SAVE_RAW_REPORTS: 'true'
        run: python src/run_pipeline.py
      - name: Commit updated data and dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard
          git diff --cached --quiet || git commit -m "chore: update DART financial data"
          git push
