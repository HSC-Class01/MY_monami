<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모나미 DART 재무 Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#102a43,#2f6f8f);color:#fff;border-radius:22px;padding:30px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-top:14px}.v{font-size:25px;font-weight:750;margin-top:8px}.k{font-size:13px;color:#667085}.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px}.chart{height:330px}.table{overflow:auto;border:1px solid #e5e7eb;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f3;text-align:right;font-size:12px;white-space:nowrap}th{background:#fafbfc;color:#667085}th:first-child,td:first-child{text-align:left}.note{font-size:12px;color:#667085;margin-top:8px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>모나미 재무분석 Dashboard</h1><div>DART 005360 · corp_code 00121288 · 사업/반기/분기보고서</div></div><div id="kpi" class="grid"></div><div class="charts"><div class="card chart"><canvas id="trend"></canvas></div><div class="card chart"><canvas id="margin"></canvas></div></div><div id="tables"></div><div class="card"><h2>국내 Peer Firms</h2><div class="table"><table><thead><tr><th>기업</th><th>비교 근거</th><th>상장 여부</th></tr></thead><tbody id="peers"></tbody></table></div><div class="note">산업 비교군이며 우열·투자등급을 의미하지 않습니다.</div></div><div class="note">Source: 금융감독원 OpenDART. 구조화 재무제표 API는 2015년 이후 제공되므로 2010–2014년은 공시원문 보관 및 레거시 추출 경로를 별도 사용합니다.</div></div><script>const money=x=>x==null?'—':(Math.abs(x)>=1e8?(x/1e8).toLocaleString('ko-KR',{maximumFractionDigits:1})+'억원':(x/1e6).toLocaleString('ko-KR',{maximumFractionDigits:0})+'백만원');const pct=x=>x==null?'—':Number(x).toLocaleString('ko-KR',{maximumFractionDigits:1})+'%';const num=x=>x==null?'—':Number(x).toLocaleString('ko-KR',{maximumFractionDigits:2});function makeTable(title,rows){let cols=[['year','연도'],['period','보고서'],['revenue','매출액'],['operating_income','영업이익'],['net_income','순이익'],['assets','자산'],['liabilities','부채'],['equity','자본'],['cfo','CFO'],['fcf','FCF'],['gross_margin','매출총이익률'],['operating_margin','영업이익률'],['net_margin','순이익률'],['current_ratio','유동비율'],['debt_ratio','부채비율'],['equity_ratio','자기자본비율'],['interest_coverage','이자보상배율'],['roa','ROA'],['roe','ROE'],['asset_turnover','총자산회전율']];let h='<div class="card"><h2>'+title+'</h2><div class="table"><table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>';rows.slice().sort((a,b)=>b.year-a.year).forEach(r=>{h+='<tr>'+cols.map(c=>{let v=r[c[0]];if(['revenue','operating_income','net_income','assets','liabilities','equity','cfo','fcf'].includes(c[0]))v=money(v);else if(['gross_margin','operating_margin','net_margin','current_ratio','debt_ratio','equity_ratio','roa','roe'].includes(c[0]))v=pct(v);else v=num(v);return '<td>'+v+'</td>'}).join('')+'</tr>'});return h+'</tbody></table></div></div>'}fetch('data.json').then(r=>r.json()).then(d=>{let rows=d.rows||[],last=rows.slice().sort((a,b)=>a.year-b.year).at(-1)||{};document.getElementById('kpi').innerHTML=[['매출액',money(last.revenue)],['영업이익률',pct(last.operating_margin)],['CFO',money(last.cfo)],['부채비율',pct(last.debt_ratio)]].map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('');document.getElementById('tables').innerHTML=makeTable('Annual',rows.filter(r=>r.period==='annual'))+makeTable('Half-year',rows.filter(r=>r.period==='half'))+makeTable('Quarterly',rows.filter(r=>String(r.period).startsWith('quarter')));document.getElementById('peers').innerHTML=d.peers.map(p=>'<tr><td>'+p.name+'</td><td>'+p.basis+'</td><td>'+p.listed+'</td></tr>').join('');let a=rows.filter(r=>r.period==='annual').sort((x,y)=>x.year-y.year);new Chart(document.getElementById('trend'),{type:'line',data:{labels:a.map(r=>r.year),datasets:[{label:'매출액',data:a.map(r=>r.revenue),tension:.25},{label:'영업이익',data:a.map(r=>r.operating_income),tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Annual Revenue & Operating Income'}}}});new Chart(document.getElementById('margin'),{type:'bar',data:{labels:a.map(r=>r.year),datasets:[{label:'영업이익률',data:a.map(r=>r.operating_margin)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Operating Margin (%)'}}}})})</script></body></html>
